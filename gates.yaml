# gates.yaml — ADR-0014 §2 Gate Contract manifest for Verbara.Sdk.
# One entry per language-agnostic gate class (G1-G8). Cross-checkable by /xr:doctor.
#   status: present | partial | na
#   impl:          (present/partial) the CONCRETE CI job / script / guard that instantiates it — exists in this repo
#   justification: (na) why the class genuinely does not apply to this repo's stack + chain role
repo: Verbara.Sdk
role: root
visibility: public          # MIT open-core (the free, decompilable-by-design tier)
charter: docs/specs/architecture.md
decision_ref: verbara-meta/ADR-0014
gates:
  - id: G1
    class: build-strictness
    status: present
    impl: >-
      .github/workflows/ci.yml job "Unit Tests" (unit-tests) — dotnet build Verbara.Sdk.slnx -c Release
      then the unit test subset; "OpenSpec Validate" (openspec) type-checks specs/changes strict.
      Docs-only PRs skip "Unit Tests" via the verbara-meta/ADR-0016 §1 gate job (a skipped required
      check satisfies classic branch protection); "OpenSpec Validate" stays always-run.

  - id: G2
    class: warnings-as-errors+banned-deps
    status: present
    impl: >-
      Directory.Build.props: TreatWarningsAsErrors=true + WarningLevel=9999 (repo-wide);
      BanDapperPackageReferences MSBuild target fails the build on any Dapper/Dapper.AOT/
      Verbara.Sdk.Dapper.Stubs reference (ADR-0022); Microsoft.CodeAnalysis.BannedApiAnalyzers +
      BannedSymbols.txt ban reflection APIs and DateTime.Now; ci.yml "Pack Warnings Gate"
      (pack-check) re-asserts -p:TreatWarningsAsErrors=true at pack time.

  - id: G3
    class: coverage
    status: present
    impl: >-
      ci.yml "Coverage Ratchet" (coverage) runs the ADR-0013 triplet against coverage-floor.json —
      scripts/check-coverage-floor.py (two-sided band), scripts/check-patch-coverage.py (diff-cover
      patch floor, needs fetch-depth:0), scripts/check-exclusion-baseline.py (denominator guard vs
      coverage-exclusion-baseline.json); ci.yml "Coverage Script Tests" (coverage-scripts) unit-tests
      the guards themselves (scripts/tests/). Manual ratchet, no CI write-back (ADR-0003/ADR-0038).
      "Coverage Ratchet" is gated by the verbara-meta/ADR-0016 §1 fast-path and does not run on
      docs-only diffs; "Coverage Script Tests" carries NO `needs: gate` edge and additionally hosts
      scripts/tests/test_classify_docs_only.sh, the ADR-0016 §3.4 classifier suite (promoted to a
      required context 2026-07-27).

  - id: G4
    class: architecture-layering
    status: present
    impl: >-
      Tests/Verbara.Sdk.Governance.Tests (ordinary xunit, runs in the "Unit Tests" job):
      LayeringGuardTests + ProjectGraph — no non-provider package may compile-time ProjectReference a
      provider (.Postgres/.Redis/.Nats); ReflectionBanGuardTests + ReflectionBanScanner — zero-tolerance
      Roslyn scan for AOT-breaking reflection in src/. Both carry liveness self-tests (≥20 projects /
      ≥400 files) so a broken locator cannot false-green.

  - id: G5
    class: content-invariants
    status: present
    impl: >-
      Three grep/Roslyn content guards no analyzer covers: SyncFenceRegressionGuardTests +
      SyncFenceScanner (net-new-only wall-clock-barrier ratchet vs sync-fence-baseline.json, ADR-0004);
      Tests/Verbara.Sdk.DocSnippets.Tests DocSnippetCompilationTests (every ```csharp doc block must
      still compile against the real API); ci.yml "Audit Test Asserts" (audit-test-asserts) via
      tools/audit-test-asserts.sh (no assertion-free [Fact]/[Theory]).
      DocSnippetCompilationTests runs inside the ADR-0016-gated "Unit Tests" job, so the six Markdown
      files it compiles are explicitly carved OUT of the fast-path allowlist
      (scripts/ci/classify-docs-only.sh, BEGIN docsnippets-carveout), pinned by a drift test;
      "Audit Test Asserts" is ADR-0016-gated and does not run on docs-only diffs.

  - id: G6
    class: budgets
    status: na
    justification: >-
      No natural LOC/bundle ceiling for a 29-package client library (no shipped app binary, no
      web bundle). The nearest analogue — performance regression against README-cited BenchmarkDotNet
      numbers — exists (.github/workflows/perf-regression.yml) but is a WEEKLY scheduled report, not a
      per-PR budget gate (BenchmarkDotNet needs ~20-25 min for stable numbers; per-PR cost rejected).
      Tests/Verbara.Sdk.Benchmarks/baseline.json + scripts/ci/check-perf-baseline.py now diff every
      weekly run against committed hosted-runner bands and fail closed on a missing/empty result
      (ADR-0042 D4), with a breach filing an issue (D5) — but the workflow stays schedule +
      workflow_dispatch only and contributes NO required check, and the comparison is still
      OBSERVING (PERF_GATE_ENFORCE='false') pending two clean scheduled runs. So: a gate exists,
      it is not a per-PR budget gate, and G6 stays `na`.

  - id: G7
    class: publish-reality
    status: present
    impl: >-
      ci.yml "AOT Trim Check" (aot-check) runs tools/verify-aot.sh — a trim-safe self-contained
      dotnet publish of tools/AotCanary with /warnaserror + a smoke-run when host RID matches — proving
      the ship-shape (Native AOT) invariant at PR time, not release time; standalone aot-validate.yml
      mirrors it on push:[main]. Directory.Build.props EnablePackageValidation (baseline 2.1.0) +
      PublicApiAnalyzers, surfaced by "Pack Warnings Gate" (pack-check), catch breaking API/package
      drift before publish.yml (tag-triggered nuget.org push) ever runs.
      "AOT Trim Check" and "Pack Warnings Gate" are ADR-0016-gated (they report skipped on docs-only
      diffs); aot-validate.yml's pull_request trigger additionally carries the ADR-0016 §2
      paths-ignore, while its push:[main] baseline stays unfiltered.

  - id: G8
    class: supply-chain
    status: present
    impl: >-
      codeql.yml (Analyze C#, security-extended, PR + merge_group + weekly); dependency-review.yml
      (fail-on-severity high, denies GPL/AGPL/SSPL licenses); .github/dependabot.yml (daily nuget +
      github-actions, release cooldown so freshly published packages settle before a bump PR opens);
      dependabot-automerge.yml auto-merges only low-risk (non-major) analyzer/actions bumps through the
      merge queue.
