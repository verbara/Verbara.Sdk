; Server A of the two-server fixture: the PBX under test, with a PJSIP trunk to server B.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; The far phone 'agent' lives on server B. The queue member must be this endpoint's name (PJSIP/agent): app_queue
; reads the member's device state from it. A dial string such as PJSIP/agent@trunk is never rung (measured: 0 of 10).
[agent]
type = aor
contact = sip:agent@server-b:5060

[agent]
type = endpoint
context = from-b
disallow = all
allow = ulaw
aors = agent
direct_media = no

; Every unidentified inbound call (the SIPp caller) lands here.
[anonymous]
type = endpoint
context = from-sipp
disallow = all
allow = ulaw
direct_media = no
