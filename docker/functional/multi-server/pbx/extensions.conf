; Server A of the two-server fixture.
[general]
static = yes
writeprotect = no

[lab]
; A queue call: the caller's leg waits in q-trunk, whose one member answers on server B.
exten => queue,1,Queue(q-trunk,,,,60)
 same => n,Hangup()
; A direct call over the trunk, no queue.
exten => direct,1,Dial(PJSIP/agent,30)
 same => n,Hangup()
; A marker call: originated with Application=UserEvent, it raises one UserEvent on A once answered, so an observer
; that receives it has received every event A sent it before.
exten => marker,1,Answer()
 same => n,Wait(2)
 same => n,Hangup()

; The SIPp caller: any number is carried over the trunk to server B's far number.
[from-sipp]
exten => _X.,1,Dial(PJSIP/agent,30)
 same => n,Hangup()

[from-b]
exten => _X.,1,Hangup()
