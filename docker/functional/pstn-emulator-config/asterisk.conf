[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
runuser = asterisk
rungroup = asterisk
documentation_language = en_US
; The system name of server B of the two-server fixture (and the compose PSTN emulator): every Uniqueid and Linkedid it issues starts with "b-". Two servers booted
; together with no system name issue the same ids in the same second (measured on 22: both issued
; <epoch>.0 and <epoch>.1 for one call each), and the session engine would mix their calls.
systemname = b
