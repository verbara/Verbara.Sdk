[general]
persistentmembers = no

[test-queue]
strategy = ringall
timeout = 30
retry = 5
maxlen = 10
wrapuptime = 0

[test-queue-2]
strategy = ringall
timeout = 30
retry = 5
maxlen = 10
wrapuptime = 0

; Queue-exit tests (QueueExitCountFunctionalTests). Neither queue has a member, and both let a caller join empty, so
; every visit ends by the queue's timeout (Queue()'s own timeout argument, 3 s) or by the caller's key.
[test-queue-timeout]
strategy = ringall
timeout = 2
retry = 1
joinempty = yes
leavewhenempty = no
wrapuptime = 0

; A caller waiting here leaves the queue by pressing a digit that exists in the context queue-key-exit (1).
[test-queue-key]
strategy = ringall
timeout = 2
retry = 1
joinempty = yes
leavewhenempty = no
wrapuptime = 0
context = queue-key-exit
