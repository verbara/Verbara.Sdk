[general]

; The lot ParkingTests exercises: a call redirected to parkext 750 parks in the first free space of
; 751-770 and times out after 10 s. The lot registers 750 and its spaces in [parkedcalls], which
; [test-functional] includes, so a test reaches both through that context.
[default]
context = parkedcalls
parkext = 750
parkpos = 751-770
parkingtime = 10
parkedcallreparking = caller
parkedcallhangup = caller
