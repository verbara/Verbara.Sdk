; Call features for TransferTests (Verbara.Sdk.FunctionalTests, Layer5_Integration/Bridge). The AMI Atxfer action
; plays the atxfer feature code into the channel, so without one it answers "No attended transfer feature code
; found" (measured on Asterisk 23). Dial's T and t options turn the feature on for a call.
[general]
; The image ships no sound files. The attended transfer plays this announcement before it reads the target's
; digits, and a missing file aborts the transfer; empty plays nothing.
transferannouncesound =

[featuremap]
atxfer => *2
