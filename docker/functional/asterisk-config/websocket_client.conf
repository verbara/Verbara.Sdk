; chan_websocket's outbound connections (res_websocket_client). Used by ExternalMediaWebSocketFunctionalTests
; (Tests/Verbara.Sdk.FunctionalTests/Layer5_Integration/Audio): an ARI externalMedia create with
; transport=websocket and external_host=sdk-media makes Asterisk connect, per call, to the WebSocket audio server
; that test runs on the TEST HOST.
;
; Every call through this entry upgrades on the same URI, so the path below names no call: the server keys each
; stream by the channel_id of the MEDIA_START Asterisk sends as the connection's first frame. The section name is
; load-bearing: the test passes it as external_host, so change one and the matching constant in the test changes
; with it.
;
; per_call_config: nothing connects at startup or between calls, so the entry is inert for every other test.
; host.docker.internal is the Docker host gateway (AsteriskContainer maps it with WithExtraHost); the port is high
; and fixed, beside the AudioSocket ports of extensions.conf (19092, 19093) and the externalMedia AudioSocket test's
; 19094, because this file cannot learn an ephemeral one. protocols = media is what Asterisk offers on the upgrade.
[sdk-media]
type = websocket_client
connection_type = per_call_config
uri = ws://host.docker.internal:19095/media/sdk-media
protocols = media
connection_timeout = 5000
reconnect_interval = 500
reconnect_attempts = 2
tls_enabled = no
