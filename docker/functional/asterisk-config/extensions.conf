[general]
static = yes
writeprotect = no

[globals]

; Integration + functional test context
[default]
; FastAGI integration test — calls back to the host test server on port 4573
exten => 200,1,NoOp(FastAGI Test)
 same => n,AGI(agi://host.docker.internal:4573/test-script)
 same => n,Hangup()

exten => _X.,1,NoOp(Default: ${EXTEN})
 same => n,Answer()
 same => n,Wait(5)
 same => n,Hangup()

; Stasis app for ARI tests
[stasis-test]
exten => _X.,1,NoOp(Stasis: ${EXTEN})
 same => n,Answer()
 same => n,Stasis(test-app)
 same => n,Hangup()

; Queue dialplan for queue functional tests
[queue-test]
exten => _X.,1,NoOp(Queue: ${EXTEN})
 same => n,Answer()
 same => n,Queue(${EXTEN},,,,30)
 same => n,Hangup()

; Echo test
exten => echo,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Functional test context — all tests that originate Local/NNN@test-functional land here
[test-functional]

; ext 100: Answer + Wait — used by MixMonitor (AMI-controlled) and PlayDtmf tests
exten => 100,1,Answer()
 same => n,Wait(30)
 same => n,Hangup()

; ext 150: Answer + SendDTMF — used by DtmfDetectionTests.SendDtmf_MultipleDigits_ShouldFireSequentialEvents
; The ;1 half of Local/150@test-functional executes this dialplan extension.
exten => 150,1,Answer()
 same => n,Wait(1)
 same => n,SendDTMF(123456789*#,250,200)
 same => n,Wait(2)
 same => n,Hangup()

; ext 155: Answer + Read — used by DtmfDetectionTests.DtmfConsumedByRead_ShouldFireDtmfEvent
exten => 155,1,Answer()
 same => n,Read(RESULT,,1,,,5)
 same => n,Wait(2)
 same => n,Hangup()

; ext 500: Queue entry — used by all QueueCallerTests / QueueMemberTests / QueueMetricsTests
exten => 500,1,Answer()
 same => n,Queue(test-queue,,,,30)
 same => n,Hangup()

; ext 600: Answer + Wait — ;1 half for Local channel entering ConfBridge via Application+Data
; Used by BridgeLifecycleTests which originates Application="ConfBridge", Data="test-bridge-NN"
exten => 600,1,Answer()
 same => n,Wait(30)
 same => n,Hangup()

; ext 900: MixMonitor dialplan test — fires Start + Wait(5) + Stop events
; Used by MixMonitorTests.DialplanMixMonitor_ShouldFireStartAndStopEvents
;          and MixMonitorTests.MixMonitor_StartAndStop_ShouldHaveMatchingChannel
exten => 900,1,Answer()
 same => n,MixMonitor(test-${UNIQUEID}.wav)
 same => n,Wait(5)
 same => n,StopMixMonitor()
 same => n,Hangup()

; ext 950: Voicemail entry — used by VoicemailTests
exten => 950,1,Answer()
 same => n,VoiceMail(9001@default)
 same => n,Hangup()

; ext 700 / 701: AudioSocket — hand the call to an AudioSocket server running on the TEST HOST.
; Used by AudioSocketWireFunctionalTests (Layer5_Integration/Audio); 700 is the
; Verbara.Sdk.Ari server, 701 the Verbara.Sdk.VoiceAi.AudioSocket one.
;
; Until this change the functional dialplan had NO AudioSocket() extension at all — it covered
; FastAGI, Stasis, queues and echo — so nothing here ever reached either AudioSocket server, and a
; wire format Asterisk does not speak (a four-byte header, 0x01 read as audio) survived six months
; of green unit tests. Those tests built their frames with the codec under test; this extension is
; the other half of the fix, and the only thing in this repository that puts a real
; res_audiosocket.so on the other end of the socket.
;
; The first argument is the UUID Asterisk sends in its identification frame. Each test asserts the
; session it accepts carries exactly this value, so these two literals are load-bearing: change one
; here and the matching constant in the test file changes with it.
;
; host.docker.internal is the Docker host gateway (AsteriskContainer maps it with
; WithExtraHost); the server under test runs on the host, not in this container. The ports are
; high and fixed because a dialplan file cannot learn an ephemeral one.
exten => 700,1,NoOp(AudioSocket: Verbara.Sdk.Ari audio server)
 same => n,Answer()
 same => n,AudioSocket(4f1d9c60-7a2b-4e55-9f3d-2c6a8b0e1d47,host.docker.internal:19092)
 same => n,Hangup()

exten => 701,1,NoOp(AudioSocket: Verbara.Sdk.VoiceAi.AudioSocket server)
 same => n,Answer()
 same => n,AudioSocket(6b3e2a18-5c94-4d07-8ae1-93f5c7204b6e,host.docker.internal:19093)
 same => n,Hangup()
