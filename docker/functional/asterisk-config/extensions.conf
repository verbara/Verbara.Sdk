[general]
static = yes
writeprotect = no

[globals]

; Integration + functional test context
[default]
; FastAGI integration test — calls back to the host test server on port 4573
exten => 200,1,NoOp(FastAGI Test)
 same => n,AGI(agi://host.docker.internal:4573/test-script)
 same => n,Hangup()

exten => _X.,1,NoOp(Default: ${EXTEN})
 same => n,Answer()
 same => n,Wait(5)
 same => n,Hangup()

; Stasis app for ARI tests
[stasis-test]
exten => _X.,1,NoOp(Stasis: ${EXTEN})
 same => n,Answer()
 same => n,Stasis(test-app)
 same => n,Hangup()

; Queue dialplan for queue functional tests
[queue-test]
exten => _X.,1,NoOp(Queue: ${EXTEN})
 same => n,Answer()
 same => n,Queue(${EXTEN},,,,30)
 same => n,Hangup()

; Echo test
exten => echo,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Functional test context — all tests that originate Local/NNN@test-functional land here
[test-functional]
; Every extension a functional test dials into this context must be defined here or reached through
; an include. The Governance test DialplanCoverageGuardTests fails the unit lane otherwise, naming the
; dialling file and line; a number a test dials on purpose because it does not exist is listed there,
; with its reason.

; Call parking: res_parking.conf registers the lot's parkext 750 and spaces 751-770 in
; [parkedcalls]. Used by ParkingTests, which redirects a call to 750 and dials the space it got.
include => parkedcalls

; ext 100: Answer + Wait — used by MixMonitor (AMI-controlled) and PlayDtmf tests
exten => 100,1,Answer()
 same => n,Wait(30)
 same => n,Hangup()

; ext 120: rings 8 s, then answers — a destination that rings longer than the AMI connection's 5 s
; DefaultEventTimeout. Used by OriginateOutcomeTests (Layer5_Integration/EventDelivery): the
; OriginateResponse comes ~8 s after the originate, as measured for this dialplan on 20.20.1,
; 22.9.0 and 23.4.1, so OriginateAsync must wait for it past the event timeout.
exten => 120,1,Ringing()
 same => n,Wait(8)
 same => n,Answer()
 same => n,Wait(2)
 same => n,Hangup()

; ext 150: Answer + SendDTMF — used by DtmfDetectionTests.SendDtmf_MultipleDigits_ShouldFireSequentialEvents
; The ;1 half of Local/150@test-functional executes this dialplan extension.
exten => 150,1,Answer()
 same => n,Wait(1)
 same => n,SendDTMF(123456789*#,250,200)
 same => n,Wait(2)
 same => n,Hangup()

; ext 155: Answer + Read — used by DtmfDetectionTests.DtmfConsumedByRead_ShouldFireDtmfEvent
exten => 155,1,Answer()
 same => n,Read(RESULT,,1,,,5)
 same => n,Wait(2)
 same => n,Hangup()

; ext 500: Queue entry — used by all QueueCallerTests / QueueMemberTests / QueueMetricsTests
exten => 500,1,Answer()
 same => n,Queue(test-queue,,,,30)
 same => n,Hangup()

; ext 510: the queue's timeout — used by QueueExitCountFunctionalTests. The caller joins test-queue-timeout, which
; has no member; Queue()'s timeout argument ends the visit after 3 s, and the caller then stays on the line (an
; announcement) until the test hangs it up.
exten => 510,1,Answer()
 same => n,Queue(test-queue-timeout,,,,3)
 same => n,Wait(30)
 same => n,Hangup()

; ext 520: the key exit — used by QueueExitCountFunctionalTests. The ;2 half of Local/520@test-functional joins
; test-queue-key; the ;1 half, the far end of that call, runs ext 521 once the ;2 half answers.
exten => 520,1,Answer()
 same => n,Queue(test-queue-key)
 same => n,Wait(30)
 same => n,Hangup()

; ext 521: the far end of ext 520 — waits 2 s, presses 1 and stays on the line.
exten => 521,1,Wait(2)
 same => n,SendDTMF(1,250)
 same => n,Wait(30)
 same => n,Hangup()

; ext 600: Answer + Wait — ;1 half for Local channel entering ConfBridge via Application+Data
; Used by BridgeLifecycleTests which originates Application="ConfBridge", Data="test-bridge-NN"
exten => 600,1,Answer()
 same => n,Wait(30)
 same => n,Hangup()

; ext 700: Answer + Wait — the same shape as 600, for the ;1 half of a Local channel entering
; ConfBridge via Application+Data. Used by ConfBridgeAdvancedTests (Mute, Unmute, Kick, Lock, Unlock,
; StartRecord, StopRecord, Conference_ShouldFireStartOnFirstJoinAndEndOnLastLeave)
exten => 700,1,Answer()
 same => n,Wait(30)
 same => n,Hangup()

; ext 161: a blind-transfer target that keeps the call alive — used by TransferTests
; (BlindTransfer_ShouldRedirectChannel, _ShouldFireBlindTransferEvent, _ShouldUpdateChannelManager,
; _DuringBridge_ShouldTransferOneParty; AttendedTransfer_ShouldInitiateConsultation)
exten => 161,1,Answer()
 same => n,Wait(10)
 same => n,Hangup()

; ext 162: an attended-transfer consultation target — used by TransferTests.AttendedTransfer_ShouldFireEvent
exten => 162,1,Answer()
 same => n,Wait(10)
 same => n,Hangup()

; ext 163: a short-lived attended-transfer target — used by TransferTests.AttendedTransfer_Cancel_ShouldPreserveBridge
exten => 163,1,Answer()
 same => n,Wait(2)
 same => n,Hangup()

; ext 160: IVR menu entry — used by IvrNavigationTests. The menu runs in [ivr-menu], so that its
; i (invalid) and t (timeout) handlers apply to the menu only: in this context an i would catch the
; redirect TransferTests sends to a number that does not exist on purpose.
exten => 160,1,Goto(ivr-menu,160,1)

; ext 900: MixMonitor dialplan test — fires Start + Wait(5) + Stop events
; Used by MixMonitorTests.DialplanMixMonitor_ShouldFireStartAndStopEvents
;          and MixMonitorTests.MixMonitor_StartAndStop_ShouldHaveMatchingChannel
exten => 900,1,Answer()
 same => n,MixMonitor(test-${UNIQUEID}.wav)
 same => n,Wait(5)
 same => n,StopMixMonitor()
 same => n,Hangup()

; ext 950: Voicemail entry — used by VoicemailTests
exten => 950,1,Answer()
 same => n,VoiceMail(9001@default)
 same => n,Hangup()

; ext 710 / 711: AudioSocket — hand the call to an AudioSocket server running on the TEST HOST.
; Used by AudioSocketWireFunctionalTests (Layer5_Integration/Audio); 710 is the
; Verbara.Sdk.Ari server, 711 the Verbara.Sdk.VoiceAi.AudioSocket one.
;
; Until this change the functional dialplan had NO AudioSocket() extension at all — it covered
; FastAGI, Stasis, queues and echo — so nothing here ever reached either AudioSocket server, and a
; wire format Asterisk does not speak (a four-byte header, 0x01 read as audio) survived six months
; of green unit tests. Those tests built their frames with the codec under test; this extension is
; the other half of the fix, and the only thing in this repository that puts a real
; res_audiosocket.so on the other end of the socket.
;
; The first argument is the UUID Asterisk sends in its identification frame. Each test asserts the
; session it accepts carries exactly this value, so these two literals are load-bearing: change one
; here and the matching constant in the test file changes with it.
;
; host.docker.internal is the Docker host gateway (AsteriskContainer maps it with
; WithExtraHost); the server under test runs on the host, not in this container. The ports are
; high and fixed because a dialplan file cannot learn an ephemeral one.
exten => 710,1,NoOp(AudioSocket: Verbara.Sdk.Ari audio server)
 same => n,Answer()
 same => n,AudioSocket(4f1d9c60-7a2b-4e55-9f3d-2c6a8b0e1d47,host.docker.internal:19092)
 same => n,Hangup()

exten => 711,1,NoOp(AudioSocket: Verbara.Sdk.VoiceAi.AudioSocket server)
 same => n,Answer()
 same => n,AudioSocket(6b3e2a18-5c94-4d07-8ae1-93f5c7204b6e,host.docker.internal:19093)
 same => n,Hangup()

; IVR menu for IvrNavigationTests, entered from 160@test-functional. The image ships no sound
; files (the Dockerfile omits the sound packs), so the menu plays nothing: Wait(1) stands where a
; prompt would play, then WaitExten(5) collects one digit. 1 -> 165, 2 -> 166, any other digit -> i,
; which returns to the menu, and no digit within 5 s -> t, which hangs up.
[ivr-menu]
exten => 160,1,Answer()
 same => n,Wait(1)
 same => n,WaitExten(5)

exten => 1,1,Goto(ivr-menu,165,1)
exten => 2,1,Goto(ivr-menu,166,1)
exten => i,1,Goto(ivr-menu,160,1)
exten => t,1,Hangup()

exten => 165,1,Answer()
 same => n,Wait(10)
 same => n,Hangup()

exten => 166,1,Answer()
 same => n,Wait(10)
 same => n,Hangup()

; The exit context of test-queue-key: digit 1 takes the caller out of the queue, and it stays on the line until the
; test hangs it up.
[queue-key-exit]
exten => 1,1,Wait(30)
 same => n,Hangup()
