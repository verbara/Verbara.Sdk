[general]
enabled = yes
bindaddr = 0.0.0.0
port = 5038

; Integration test user (Asterisk.Sdk.IntegrationTests AsteriskFixture default)
[testadmin]
secret = testpass
read = system,call,agent,user,config,originate,reporting,command,dtmf,cdr
write = system,call,agent,user,config,originate,command,reporting,dtmf
deny = 0.0.0.0/0.0.0.0
permit = 0.0.0.0/0.0.0.0

; Realtime-DB test user (Asterisk.Sdk.FunctionalTests RealtimeDbFixture default)
[dashboard]
secret = dashboard
read = system,call,agent,user,config,originate,reporting,command,dtmf,cdr
write = system,call,agent,user,config,originate,command,reporting,dtmf
deny = 0.0.0.0/0.0.0.0
permit = 0.0.0.0/0.0.0.0

; Restricted test user (Verbara.Sdk.FunctionalTests RefusedStatusReloadTests): it may not run Status,
; because its write classes hold none of system, call or reporting, which Status requires. It may run
; QueueStatus (registered with no class), Agents (agent) and Originate (originate), measured on Asterisk
; 20.20.1, 22.9.0 and 23.4.1. Its read classes match testadmin's, so it receives every call event.
; A lab-only fixture credential, like testadmin/testpass.
[nostatus]
secret = nostatuspass
read = system,call,agent,user,config,originate,reporting,command,dtmf,cdr
write = agent,originate,user
deny = 0.0.0.0/0.0.0.0
permit = 0.0.0.0/0.0.0.0
