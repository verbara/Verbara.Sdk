schema: spec-driven

context: |
  Verbara.Sdk — the public, MIT-licensed foundation SDK. .NET 10, C# 14. A suite of AOT-compatible
  packages (src/ is the authoritative count): AMI/ARI/AGI clients for Asterisk PBX, Voice AI pipeline,
  session management, push notifications, cluster primitives, and resilience patterns (Verbara.Sdk.Resilience).
  Position in the dependency chain: Sdk (MIT) -> Sdk.Pro (private) -> Platform. This is the root.
  Because it is public and consumed downstream, every change here is potentially breaking for Pro and Platform —
  treat the public API surface as a contract.

  Hard constraints (non-negotiable):
  - AOT-first: no reflection; use [JsonSerializable], [LoggerMessage], static dispatch.
  - Dapper is BANNED across the ecosystem (MSBuild guard). Use Verbara.Sdk.Data.Npgsql for Postgres.
  - TreatWarningsAsErrors=true, WarningLevel=9999 — zero warnings.
  - Public, MIT — never accept Pro/closed-source concepts into this repo (open-core boundary).
  - Before any commit or push, run the fast, deterministic, non-service steps of this repo's own
    .github/workflows/ci.yml on the integrated branch — build plus the touched tests plus
    `openspec validate` is a strict subset, because a tree-scanning guard is tripped by a change anywhere.

  Cross-repo standards live in the private verbara-meta repo as ADRs.

  Where work runs (verbara-meta/ADR-0006): a change whose commits land only in this repo is
  proposed, applied and archived here. A change that needs a commit in another repo is hosted from
  the verbara-meta cockpit via `/xr:change`, not here — if a change turns out to need one, record
  the finding in `tasks.md` and recommend `/xr:change` before capturing more.

rules:
  proposal:
    - "Set a `tier` in frontmatter: GRANDE (cross-repo, >3 days, or a product decision), MEDIANO (one repo, 1-3 days), or PEQUEÑO (bug fix, <1 day). PEQUEÑO may keep the proposal light."
    - "Add product-ownership frontmatter: owner, approver, stakeholder, decision_ref (repo-qualified ADR that motivates or records this change, e.g. Sdk/ADR-NNNN; create or extend an ADR in docs/decisions/ when the change embodies a durable decision). With a single developer, owner = approver."
    - "State the problem (what pain, for whom) for GRANDE and MEDIANO tiers."
    - "Public-repo content rule (verbara-meta/ADR-0005, applies to ALL artifacts of a change): never include secrets/keys/tokens, customer or personal data, absolute machine paths, partner-specific commercial terms, or reproductions of private-repo content — reference private repos only as opaque names (e.g. verbara-meta/ADR-NNNN, Pro/ADR-NNNN); when in doubt the artifact goes in the private repo's docs and the public change carries the opaque reference."
  specs:
    - "Use RFC 2119 keywords: SHALL/MUST for non-negotiable requirements, SHOULD for desirable, MAY for optional."
    - "Write scenarios as GIVEN/WHEN/THEN."
    - "Call out downstream impact: any public-API change cascades to Sdk.Pro and Platform. Mark breaking changes explicitly."
    - "Include an Architectural Risk section as an H2 heading ('## Architectural Risk', a sibling of the delta sections — NEVER a '###' header inside requirements: openspec archive rebuilds every '###' as a requirement and aborts): Level (LOW/MEDIUM/HIGH), Affected (areas/repos that can break), Mitigation. Keep SHALL/MUST on the first line of each '### Requirement:'."
  design:
    - "Reference existing ADRs when relevant using the repo/ADR-NNNN format. This applies to ANY doc in this repo (not just design/openspec artifacts): a cross-repo ADR citation MUST be repo-qualified (e.g. \"Pro/ADR-0011\", \"verbara-meta/ADR-0006\") — a bare \"ADR-NNNN\" refers only to this repo's own docs/decisions/."
    - "Honor the AOT + MIT-public constraints: no reflection, no Dapper, no closed-source concepts."
    - "Record any durable architectural decision as an ADR in docs/decisions/, not only in this design."
  tasks:
    - "When a change here must be verified against its downstream consumers, spell out the local sequence: dotnet pack to local-nuget-feed -> clear NuGet cache -> dotnet restore Pro and Platform. Verification only — a change that needs a commit in Pro or Platform is hosted via `/xr:change` (verbara-meta/ADR-0006)."
    - "Verification tasks MUST include `dotnet test` green and CI green, with zero warnings (TreatWarningsAsErrors)."
    - "A release task MUST bump Directory.Build.props PackageVersion and add a CHANGELOG entry — publishing to nuget.org triggers only on a `v*` tag push (or manual workflow_dispatch) via .github/workflows/publish.yml, so merging to main without bumping/tagging is a silent no-op."
    - "Order execution in three phases — A foundation (batched), B critical components (one focused subagent each), C integration (batched) — with a fresh subagent per task, never inline in the main session."
    - "For a bug fix, write the failing regression test first, against the unfixed code, and paste its failure verbatim into `tasks.md`. For new capability, tests may batch into Phase C."

operations:
  apply:
    guidance:
      - "Do not check off a verification task until it actually ran: `dotnet test` green and CI green, zero warnings."
      - "Verifying against a locally packed build: `dotnet pack -c Release -o <local-nuget-feed>` -> `rm -rf ~/.nuget/packages/verbara.sdk*/` -> `dotnet restore` in Pro AND Platform. Skipping the cache clear restores the stale package and the consumer builds against the old surface."
      - "A version bump is not a publish: nuget.org publishes only on a `v*` tag push (or manual workflow_dispatch). Merging a bumped `Directory.Build.props` to `main` is a silent no-op."
      - "Add the `CHANGELOG.md [Unreleased]` entry in this PR; leave its `(#N)` citation for close-out."
      - "Conventional Commits (`feat:`/`fix:`/`docs:`/`refactor:`/`test:`/`chore:`), and never a `Co-Authored-By` trailer."
      - "Anything deferred or discovered mid-apply goes into `tasks.md` or an open change — never only into the PR prose, which nothing reads at close-out."
  archive:
    guidance:
      - "Close out with the CLI: `openspec archive <name> --yes`. Do NOT use `/opsx:archive`, `/opsx:bulk-archive` or `/opsx:sync` — the agent archive path never invokes the CLI, and its no-sync branch moves the change away with the main specs never updated (a later `validate --all --strict` still passes, because the deltas are gone)."
      - "Add `--skip-specs` only if this change already went through a sync. On a change that never synced it silently drops the deltas."
      - "Before archiving: reconcile the living spec, harvest every deferred AND incidentally discovered follow-up into an open change or an ADR addendum, and check off `tasks.md`. A label such as out of scope, not deferred, noted for the maintainer, or tracked separately (with no link to the tracked item) does not exempt a finding recorded in `tasks.md`, the feature PR body or review output."
      - "Sweep referrers to the change path before the directory moves — `.github/workflows/`, `scripts/` and test fixtures, not only Markdown."
      - "If archive aborts because this change removes a capability's LAST requirement, that is expected: add `retire_capabilities: true` to the change's `.openspec.yaml`. It DELETES the living spec — use it only for genuine retirement."
      - "Land the close-out as its own `docs(openspec):` PR; `main` is protected. Backfill the feature PR's `(#N)` citation into `CHANGELOG.md [Unreleased]` here — the number did not exist at apply time. The close-out PR body carries three result lines: `Harvested:` <item → open change/ADR> or none; `Cited:` the feature PR's `(#N)` found in `CHANGELOG.md [Unreleased]`, or n/a (feature PR typed docs/chore/ci/test, or the repo has no `CHANGELOG.md`); `Referrer sweep:` <paths fixed> or none."
