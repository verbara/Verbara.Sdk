version: 2
updates:
  # .NET / NuGet dependencies (tracked via Directory.Packages.props)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Wait after a release before opening a version-update PR, so freshly
    # published (potentially compromised) packages settle first. Does not
    # delay security updates — those still open as soon as an alert lands.
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # FluentAssertions 8.x switched to a commercial license — incompatible
      # with the SDK's MIT licensing. Pin to 7.x until a license strategy is decided.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      # xunit.runner.visualstudio 3.x requires xunit v3; we're on xunit 2.9.x.
      # Revisit when migrating the test stack to xunit v3.
      - dependency-name: "xunit.runner.visualstudio"
        update-types: ["version-update:semver-major"]
      # Microsoft.NET.Test.Sdk major bumps typically track xunit major bumps;
      # pin to 17.x until the xunit v3 migration is scheduled.
      - dependency-name: "Microsoft.NET.Test.Sdk"
        update-types: ["version-update:semver-major"]
    groups:
      # Group all Microsoft.Extensions.* bumps into a single PR.
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.CodeAnalysis.*"
      # Group all xunit/test-stack bumps together.
      test-stack:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "NSubstitute*"
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"
      # Group analyzer bumps.
      analyzers:
        patterns:
          - "Meziantou.*"
          - "IDisposableAnalyzers"
          - "Microsoft.VisualStudio.Threading.Analyzers"
      # Collapse all CVE-driven security updates into a single PR. Groups
      # default to version-updates only, so this needs an explicit applies-to.
      nuget-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions used by workflows under .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
