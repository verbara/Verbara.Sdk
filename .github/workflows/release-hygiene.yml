name: Release Hygiene

# The two checks here answer questions no other workflow in this repo is positioned to ask.
#
# `publish.yml` triggers on `push: tags: v*` and nothing else, and `ci.yml` runs on
# `pull_request` + `merge_group` and deliberately drops the post-merge push run. Between them
# there is a blind spot the exact shape of a release: once a PR lands, nothing looks at the
# repo again until somebody pushes a tag. If nobody does, every signal stays green, because no
# signal is about the release. `<PackageVersion>` sat at 2.5.0 for a month that way.
#
# So this workflow runs where nothing else does — after the merge, on `main` — and its failure
# mode is a notification, not a block. It cannot be a required check: gating PRs on "a release
# is owed" would stop unrelated work to punish a maintenance task. The two jobs speak
# differently. Publish Liveness only reports, through notices on the run's summary page: a
# version staged but never tagged ("Release staged"), shipped content waiting a while ("Release
# cadence"), an [Unreleased] section near the release-body cap ("Release notes size"). It stays
# green for all three and goes red only when it cannot tell (exit 2). When to cut is the
# maintainer's call; a date is an estimate, not a deadline, and past the cap publish.yml publishes
# a shortened body instead of refusing. ApiCompat Baseline still FAILS when the package-validation
# baseline is behind the newest stable tag or missing from nuget.org, and GitHub emails the actor
# when a workflow fails on a default-branch push.
#
# The weekly schedule covers the case a push trigger structurally cannot: a staged release on a
# repo that has gone quiet, the state 2.5.0 was in near the end. Since 2026-11-26 that run carries a
# "Release staged" notice instead of failing, so it reaches whoever opens the run, not an inbox —
# the accepted cost of deciding release timing by hand. It still fails for a stale ApiCompat baseline.
#
# publish.yml's provenance gate IGNORES this workflow's check runs, matched by this file's exact
# path (scripts/ci/check-release-provenance.sh, ADR-0055 addendum 2026-09-12): they judge the
# repository against its tags, not whether the commit was built. ApiCompat Baseline is red by design
# on a release commit once the tag exists; Publish Liveness was red before the tag until it moved to
# notices, and older release commits still carry those red runs. Only add a job here if the same is
# true of it — a build or test job in this file would stop counting towards a release. Renaming or moving
# this file ends the exclusion; scripts/tests/test_release_provenance.sh fails on the PR that does.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1' # Mondays 13:00 UTC
  workflow_dispatch:

permissions: {}

# Serialise on the workflow, not the ref: both jobs read repo-wide state (tags, the published
# feed), so two overlapping runs would report on the same thing twice. Never cancel in progress
# — these runs are short, and a cancelled run reports no result at all, which is the exact
# silence this workflow exists to remove.
concurrency:
  group: release-hygiene
  cancel-in-progress: false

jobs:
  publish-liveness:
    name: Publish Liveness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history AND tags: the check derives the expected tag from Directory.Build.props,
          # asks whether it exists, and diffs from it. A shallow clone would answer "the tag does
          # not exist" for every release ever published.
          fetch-depth: 0

      - name: Make sure tags are present
        run: git fetch --tags --force --quiet

      - name: Is a release owed?
        run: scripts/ci/check-publish-liveness.sh

  apicompat-baseline:
    name: ApiCompat Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Make sure tags are present
        run: git fetch --tags --force --quiet

      # Deliberately a separate job from the one above. They report unrelated things and are
      # fixed by different edits; folding them into one job would let one job's failure (this one's,
      # or the other's "cannot tell") hide the other's result, and there is no ordering between them.
      - name: Is the package-validation baseline current?
        run: scripts/ci/check-apicompat-baseline.sh
