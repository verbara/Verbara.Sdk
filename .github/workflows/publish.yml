name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Default-deny. Only the job that needs to create a Release object is granted
# `contents: write`; nothing else in this workflow gets a token scope at all.
permissions: {}

concurrency:
  # One group for the whole workflow, NOT `publish-${{ github.ref }}`: a per-ref
  # group puts every tag in a group of its own, so two tags pushed close together
  # race each other into `dotnet nuget push`. Serialising on the workflow is the
  # point — a release is not a per-ref operation, it is a per-feed operation.
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and push to nuget.org
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the final step creates the GitHub Release object for the tag
      checks: read # the provenance gate reads this sha's check runs
      # ...and maps each one to the workflow run that produced it, to set the ignored workflows
      # (release-hygiene.yml, perf-regression.yml, Dependabot's) aside by path. Job-level permissions are exhaustive: without this scope the gate FAILS,
      # it does not degrade (ADR-0055 D1 and its 2026-09-12 addendum).
      actions: read
      # Trusted Publishing: the job's OIDC token is exchanged with nuget.org for a push key that lives one hour.
      # No long-lived key is stored in the repo. The nuget.org policy names this repository and this file.
      id-token: write
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'

      # setup-dotnet floats on 10.0.x, so the log is the only record of which SDK and runtime built
      # what this run packs and pushes. Printed before anything is built.
      - name: Record the .NET SDK and runtime
        run: |
          dotnet --version
          dotnet --info

      # ---------------------------------------------------------------------
      # Gate 1 — is this a real publish, and which version is it publishing?
      #
      # `github.ref_type == 'tag'` ALONE does not answer the first question:
      # `workflow_dispatch` lets you pick a tag in the ref dropdown, which sets
      # `ref_type` to `tag` and satisfies the very gate that was meant to keep
      # dispatch runs off the feed. Both halves are required.
      #
      # This is a correctness gate, not a security boundary. On a tag push GitHub
      # runs the workflow file AS IT EXISTS IN THE TAGGED COMMIT, so every `if:`
      # below ships with whatever is being released. The boundary that actually
      # holds is a tag ruleset on `v*` restricting who can create the tag.
      # ---------------------------------------------------------------------
      - name: Resolve release identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            IS_PUBLISH=true
            VERSION="${REF_NAME#v}"
            echo "::notice::PUBLISH run — tag $REF_NAME, version $VERSION."
          else
            IS_PUBLISH=false
            VERSION="$(sed -n 's:.*<PackageVersion>\(.*\)</PackageVersion>.*:\1:p' Directory.Build.props | head -1)"
            echo "::notice::DRY RUN ($EVENT_NAME on $REF_TYPE $REF_NAME) — packs and verifies version $VERSION, publishes NOTHING."
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a version to release."
            exit 1
          fi

          {
            echo "is_publish=$IS_PUBLISH"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Gate 2 — provenance. A tag can be cut from any commit in the repo,
      # including one that never passed CI on `main`. Two seconds of `git` and
      # two API calls buy what re-running the test suite here only approximates:
      # this exact sha reached `main`, and `main`'s checks were green on it.
      #
      # Deliberately NOT a mirrored `dotnet test` run: the unit filter in `ci.yml`
      # excludes four categories, and `Tests/Verbara.Sdk.Data.Npgsql.Tests` carries
      # 18 `[Fact]`s with no `Category` trait at all while `PostgresFixture` starts
      # a `postgres:18-alpine` container unconditionally. Mirroring the filter here
      # would drag a Docker Hub pull into the release path to re-prove what `main`
      # already proved.
      # ---------------------------------------------------------------------
      - name: Verify the tagged commit shipped through main
        if: steps.identity.outputs.is_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Peel to a COMMIT before anything else. On a tag push `$GITHUB_SHA` is only reliably a
          # commit when the tag is lightweight; for an annotated tag it can be the tag object's
          # sha, and `repos/.../commits/<sha>/check-runs` cannot resolve a non-commit — the gate
          # would fail on a release that is perfectly fine. This repo has published annotated tags
          # before (v1.x is full of them; v2.2.1 and v2.3.0 are the most recent), so this is a real
          # shape, not a hypothetical. `^{commit}` is a no-op on a lightweight tag and peels an
          # annotated one, which makes the gate indifferent to how the tag was created.
          SHA="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [ "$SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is an annotated tag object; verifying its commit $SHA."
          fi

          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not an ancestor of origin/main — this tag was cut off the release line."
            exit 1
          fi

          # Only COMPLETED runs are evidence. A run still in flight reports
          # `conclusion: null`, and this workflow's own check run is one of them —
          # counting either as a failure would make the gate self-blocking.
          #
          # Nor do three kinds of check run that say nothing about whether this commit was
          # built. release-hygiene.yml runs on the push that lands the release commit, before
          # the tag exists, so its liveness check was red on exactly the commit being released
          # — by design, as a notification (ADR-0055 D5; a green run with a notice since
          # 2026-11-26, older release commits keep the red one) — and its baseline check is red
          # if it runs after the tag; counted here, that blocked v2.5.1. perf-regression.yml
          # judges benchmarks against a baseline and triggers only on schedule and
          # workflow_dispatch, never on the way to main; a red run dispatched by hand on the
          # candidate sha blocked v2.11.0 until it was deleted. Dependabot's
          # update runs (GitHub-assigned path dynamic/dependabot/dependabot-updates) attach to
          # whatever commit is main's HEAD and often end cancelled. All three are excluded by
          # WORKFLOW PATH (check run -> check suite -> workflow run -> path), never by name,
          # which is why this job holds `actions: read`. ADR-0055 addendum (2026-09-12).
          #
          # This step only fetches; the rules live in the script, where they are
          # unit-tested (scripts/tests/test_release_provenance.sh). `--jq '.x[]'` prints
          # one JSON value per run, so `--paginate`'s page concatenation leaves no trace.
          # `filter=latest` is the API default, spelled out because the gate relies on it:
          # a re-run replaces the attempt it re-runs as soon as it STARTS, this workflow's own
          # included — so a failure that is being re-run is not seen until the re-run completes.
          CHECK_RUNS="$RUNNER_TEMP/provenance-check-runs.json"
          WORKFLOW_RUNS="$RUNNER_TEMP/provenance-workflow-runs.json"

          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?filter=latest&per_page=100" \
                 --jq '.check_runs[]' > "$CHECK_RUNS"; then
            echo "::error::Could not list the check runs for $SHA — nothing can prove this commit was built, so the gate refuses."
            exit 1
          fi

          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
                 --jq '.workflow_runs[]' > "$WORKFLOW_RUNS"; then
            echo "::error::Could not list the workflow runs for $SHA (this job needs actions: read) — the gate refuses."
            exit 1
          fi

          bash scripts/ci/check-release-provenance.sh "$SHA" "$CHECK_RUNS" "$WORKFLOW_RUNS"

          echo "::notice::$SHA is on main, and every check run this gate counts is green."

      - name: Restore
        run: dotnet restore Verbara.Sdk.slnx

      - name: Build Release
        run: dotnet build Verbara.Sdk.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Pack
        # `-p:TreatWarningsAsErrors=true` matches `ci.yml`'s pack step. Without it
        # the release pack is a laxer build than the one CI signed off on.
        run: dotnet pack Verbara.Sdk.slnx -c Release --no-build -p:TreatWarningsAsErrors=true -o ./artifacts

      # ---------------------------------------------------------------------
      # Gate 3 — assert the OUTPUT, not the input.
      #
      # Checking `<PackageVersion>` against the tag proves nothing about what is
      # on disk: NuGet normalises on the way out (`2.5.0.0` packs as `…2.5.0.nupkg`,
      # `2.5.0+ci` drops the metadata), so the file names are the only statement
      # of what would reach the feed. `ls … || true` swallowed an empty directory.
      # ---------------------------------------------------------------------
      - name: Verify packed artifacts
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          ALL=(./artifacts/*.nupkg)
          MATCHING=(./artifacts/*."$VERSION".nupkg)

          if [ ${#ALL[@]} -eq 0 ]; then
            echo "::error::Pack produced no .nupkg files."
            exit 1
          fi

          if [ ${#MATCHING[@]} -ne ${#ALL[@]} ]; then
            echo "::error::${#ALL[@]} package(s) packed but only ${#MATCHING[@]} carry version $VERSION:"
            printf '  %s\n' "${ALL[@]}"
            exit 1
          fi

          echo "${#ALL[@]} package(s) at version $VERSION:"
          printf '  %s\n' "${ALL[@]}"

      # ---------------------------------------------------------------------
      # Gate 4 — the release notes are built and validated BEFORE the push.
      #
      # The old check ran after the packages were already on nuget.org and only
      # warned, falling back to a pointer body. A grep for the heading would not
      # have caught the failure it was guarding either: with `## [2.5.0] - …`
      # immediately followed by `## [2.4.0] - …`, the heading exists and the
      # extraction still yields zero lines. Running the extraction itself is the
      # only check that agrees with what the Release step will do.
      #
      # GitHub caps a release body at 125,000 characters and `gh release create`
      # runs AFTER the push, so the size is settled here too. A body that fits is
      # the version's CHANGELOG section plus the package list, as it always was. A
      # body that does not fit no longer fails the release: the script publishes a
      # shorter one with a ::warning — a link to CHANGELOG.md at the tag, every
      # BREAKING entry in full and the heading of every other entry, or, if that is
      # still too long, the headings alone. Only a section that cannot fit even as
      # a list of headings, or an empty one, fails here, pre-push, where failing is
      # free. The rules and their tests: scripts/ci/build-release-notes.sh and
      # scripts/tests/test_build_release_notes.sh.
      # ---------------------------------------------------------------------
      - name: Build release notes from CHANGELOG.md
        # Runs on a DRY RUN too, deliberately. Everything it needs is the resolved
        # version, which both modes produce — and it is the step most able to fail
        # the release outright, so a rehearsal that skipped it would prove the least
        # about the part with the most to prove. On a dispatch the file is built,
        # validated and thrown away; only `gh release create` ever reads it.
        #
        # This also turns `workflow_dispatch` into a release-readiness check: bump
        # the version, dispatch, and the run fails until CHANGELOG.md has a section
        # for it that is not empty, and its ::warning says ahead of the tag whether
        # the release will carry the full notes or the shorter body.
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: bash scripts/ci/build-release-notes.sh "$VERSION" CHANGELOG.md ./artifacts

      # ---------------------------------------------------------------------
      # Trusted Publishing login. nuget.org trusts this repository's `publish.yml` through a policy owned by the
      # account in the `NUGET_USER` repository variable, and hands back a push key valid for one hour. It runs on a
      # DRY RUN too, on purpose: a dispatch then proves the exchange works before a tag depends on it, and the key it
      # gets is never used.
      # ---------------------------------------------------------------------
      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # ---------------------------------------------------------------------
      # The push. The key moved out of the `run:` line and into `env:`.
      #
      # `--api-key ${{ secrets.NUGET_API_KEY }}` interpolated into argv is two
      # bugs at once: the value lands in the process command line, and if the
      # secret ever resolves empty the folded `run:` collapses to
      # `--api-key --skip-duplicate`, so `--skip-duplicate` is consumed as the
      # key and the push fails in a way that reads like an auth problem.
      # ---------------------------------------------------------------------
      - name: Push to nuget.org
        if: steps.identity.outputs.is_publish == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::The Trusted Publishing login returned no key for this run."
            exit 1
          fi

          dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate 2>&1 | tee push.log

          if ! grep -q 'pushed' push.log; then
            echo "::warning::No package reported a successful push — every one was skipped as a duplicate. Expected on a re-run, suspicious on a fresh tag."
          fi

      # ---------------------------------------------------------------------
      # Gate 5 — the only check that distinguishes "published" from "green".
      # `--skip-duplicate` turns a no-op into a success, so a run can go entirely
      # green having uploaded nothing. Ask the feed. Indexing latency is real, so
      # a timeout warns rather than fails: the packages are already pushed by then
      # and failing the job would not un-push them.
      # ---------------------------------------------------------------------
      - name: Verify the feed has the release
        if: steps.identity.outputs.is_publish == 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail

          CANARY="$(basename "$(ls ./artifacts/*.nupkg | head -1)" ".$VERSION.nupkg")"
          LOWER="$(printf '%s' "$CANARY" | tr '[:upper:]' '[:lower:]')"
          INDEX="https://api.nuget.org/v3-flatcontainer/${LOWER}/index.json"

          for attempt in $(seq 1 20); do
            if curl -fsS "$INDEX" 2>/dev/null | grep -q "\"$VERSION\""; then
              echo "::notice::$CANARY $VERSION is live on nuget.org (attempt $attempt)."
              exit 0
            fi
            sleep 30
          done

          echo "::warning::$CANARY $VERSION was not visible at $INDEX after 10 minutes. Packages were pushed; confirm indexing by hand."

      - name: Create GitHub Release
        # `publish.yml` pushed the packages but never created the Release object,
        # so tags accumulated published-but-release-less — `v2.3.0` shipped that way
        # and was backfilled by hand on 2026-07-12 after an `/xr:pending` fact-check.
        # Mirrors Verbara.Platform.Web's `release.yml` (Web #246) and Sdk.Pro's
        # in-workflow `gh release create`.
        #
        # Runs AFTER the nuget push, so a Release object never advertises packages
        # that failed to publish. Idempotent — an existing Release (e.g. the themed
        # one `/xr:release` §H creates) is left untouched, never overwritten.
        if: steps.identity.outputs.is_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release object for $TAG already exists — leaving it untouched."
            exit 0
          fi

          # Claim the `Latest` badge only when this really is the highest STABLE
          # version tag, so a patch cut on an older line cannot steal it from a
          # newer minor — and a prerelease never takes it at all. `sort -V` ranks
          # `v2.5.0-rc1` ABOVE `v2.5.0`, so prereleases are filtered out first
          # rather than sorted against.
          if printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            HIGHEST="$(gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate -q '.[].name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
            if [ "$HIGHEST" = "$TAG" ]; then LATEST=true; else LATEST=false; fi
            PRERELEASE=false
            echo "highest stable tag=$HIGHEST · this tag=$TAG · --latest=$LATEST"
          else
            LATEST=false
            PRERELEASE=true
            echo "$TAG is a prerelease · --latest=false"
          fi

          gh release create "$TAG" \
            --verify-tag \
            --latest="$LATEST" \
            --prerelease="$PRERELEASE" \
            --title "$TAG" \
            --notes-file release-notes.md
