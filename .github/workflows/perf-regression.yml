name: Perf Regression

# Guard #4 of Fase 1 — pins the marketing performance numbers cited in README.md
# "Performance" section against a runnable BenchmarkDotNet suite.
#
# Why scheduled, not per-PR (ADR-0042 D2):
#   BenchmarkDotNet runs take ~3-5 min per benchmark for stable numbers
#   (warmup + multiple iterations). Five hot-path benchmarks = ~20-25 min per
#   matrix dimension. Per-PR cost would add that to every queue entry — not
#   worth the slowdown for a number that drifts slowly, and hosted-runner
#   neighbour noise at PR granularity produces false reds anyway.
#
#   `merge_group` is worse, not better (ADR-0042, Option C): the queue is
#   serial, so a 25-min job is paid per landing with nothing to hide behind.
#
# TRIGGERS ARE DELIBERATELY `schedule` + `workflow_dispatch` AND NOTHING ELSE
# (openspec `enforce-unguarded-public-claims` §2.6; ADR-0042 D2-D3, ADR-0038,
# verbara-meta/ADR-0003). No `pull_request`, no `merge_group` => this workflow's
# check-run name never appears on a PR or on a queue entry, so it can never be a
# required context and no branch-protection reconciliation is needed. Adding
# either trigger here is not a tweak: it changes the required-check set, which is
# the never-reporting-context failure mode that hangs the merge queue.
#
# WHAT CHANGED (2026-08, ADR-0042 D4/D5/D6): the "operators compare manually for
# now" era is over. `Tests/Verbara.Sdk.Benchmarks/baseline.json` now exists and
# `scripts/ci/check-perf-baseline.py` diffs every run against it, failing closed
# on a missing/empty/unparseable result — because every benchmark step below is
# suffixed `|| true`, so a benchmark that NEVER RAN would otherwise read green.
# That is the hole this closes. The `|| true` stays: it is what lets one broken
# filter still leave the other benchmarks measurable, and the comparison
# step is now what notices.
#
# IN-JOB COMPARISON (ADR-0042 addendum). The bands above cover a fleet of CPU models
# that read the same code up to 2-3x apart, so no band sees a 10-20% time regression. After the
# absolute gate, this job also builds the reference tag declared in baseline.json
# `abab.reference_tag` beside HEAD and measures both, alternated R H H R, in this job on this
# machine; scripts/ci/check-perf-abab.py judges time by the ratio HEAD/reference per round and bytes
# by the difference. It OBSERVES (PERF_ABAB_ENFORCE below) until five consecutive runs meet the
# prediction written before them. It costs about twice this job's minutes, on the hosted runner.
#
# Manual run: gh workflow run "Perf Regression"

on:
  schedule:
    # Sundays 04:00 UTC — quietest weekly slot for GitHub Actions hosted runners
    # so timing measurements suffer the least neighbor-VM noise.
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # ADR-0042 D5 — a breach files/updates an issue, not just a red run.

jobs:
  benchmark:
    name: Run BenchmarkDotNet hot-paths
    runs-on: ubuntu-latest
    # The in-job comparison adds four joint invocations (about 24-30 minutes) to the 15-20 minute
    # absolute pass. This must never be what fires: a cancelled job skips every `!cancelled()`
    # comparison step, so each phase has its own, shorter timeout (the run step 70 minutes).
    timeout-minutes: 100
    env:
      # ┌─────────────────────────────────────────────────────────────────────┐
      # │  THE FLIP. This one line is the whole difference between observing  │
      # │  and enforcing (openspec `enforce-unguarded-public-claims` §2.5).   │
      # │                                                                     │
      # │  'false' — the comparison runs, prints every delta, writes the run  │
      # │            summary and still files the breach issue, but does NOT   │
      # │            fail the job. A gate whose first act is a false red gets │
      # │            routed around, then ignored, then deleted.               │
      # │  'true'  — SLOWER, MORE-BYTES and structural failures fail the job. │
      # │            FASTER and FEWER-BYTES are reported (annotation, summary,│
      # │            breach issue) and do not fail it.                        │
      # │                                                                     │
      # │  Flipped to 'true' without two clean scheduled runs: no observed run│
      # │  was ever free of breaches, because the hosted fleet reads the same │
      # │  code up to 2-3x apart, mostly faster than the calibration. So the  │
      # │  flip came with the one-sided failure rule above and with the time  │
      # │  re-baseline of Create1000Channels for its accepted #533 cost (see  │
      # │  baseline.json). The same flag arms check-perf-baseline.py and      │
      # │  report-perf-breach.sh together.                                    │
      # └─────────────────────────────────────────────────────────────────────┘
      PERF_GATE_ENFORCE: 'true'
      # THE ABAB FLIP. 'false' = the in-job comparison against baseline.json
      # `abab.reference_tag` runs, writes its summary and artifacts, and cannot fail the job.
      # 'true' = SLOWER, MORE-BYTES and its structural failures fail it. Flipped only after five
      # consecutive runs met the prediction written before them (baseline.README.md, "Before the
      # flip"). Only 'true' or 'false': the comparator exits 2 on any other spelling, since the
      # continue-on-error lines below compare with 'true' exactly. Independent of
      # PERF_GATE_ENFORCE: check-perf-abab.py reads this one only.
      PERF_ABAB_ENFORCE: 'false'
      # ISA pin. ubuntu-latest mixes CPUs with and without AVX-512, and .NET 10 targets AVX-512
      # wherever it exists, so the same code read faster or slower by host: time "breaches" in both
      # directions on weeks when nothing here changed. This holds the JIT at x86-64-v3 on every
      # host, for the build and for every BenchmarkDotNet child process (they inherit the job env).
      # The name matters: on .NET 10 `DOTNET_EnableAVX512F=0` is accepted and ignored — measured
      # on 10.0.14, the JIT still reported x86-64-v4 under it and x86-64-v3 under this one.
      # baseline.json `jit_isa` makes the comparison fail closed if a log names any other ISA.
      DOTNET_EnableAVX512: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      # ── Exact SDK and runtime (baseline.json `environment`) ──────────────────
      # The rest of the repository floats on `10.0.x` and global.json rolls forward on purpose; this
      # job alone does not, because a runtime patch can change code generation and a time breach
      # must not be the runtime in disguise. The version is read from baseline.json, not repeated
      # here, so the install and the comparator's check cannot disagree. DOTNET_INSTALL_DIR puts it
      # in an empty directory: the runner image's preinstalled SDKs and runtimes live elsewhere,
      # so roll-forward has nothing newer to pick. `skip-lts-prepass` matters as much: by default
      # setup-dotnet first installs the newest LTS runtime into that same directory, which would
      # put the next 10.0 patch next to the declared one the week it ships. The check after it fails before 15 minutes of
      # benchmarks if anything else is reachable; the comparator checks the reports again.
      - name: Read the declared .NET environment
        id: declared
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          env = json.load(open("Tests/Verbara.Sdk.Benchmarks/baseline.json", encoding="utf-8"))["environment"]
          print(f"sdk={env['dotnet_sdk']}")
          print(f"runtime={env['dotnet_runtime']}")
          PY
      - uses: actions/setup-dotnet@v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-pinned
        with:
          dotnet-version: ${{ steps.declared.outputs.sdk }}
          skip-lts-prepass: true
      - name: Confirm the pinned SDK and runtime are the only ones reachable
        env:
          DECLARED_SDK: ${{ steps.declared.outputs.sdk }}
          DECLARED_RUNTIME: ${{ steps.declared.outputs.runtime }}
        run: |
          set -euo pipefail
          dotnet --info
          sdks="$(dotnet --list-sdks | awk '{print $1}')"
          runtimes="$(dotnet --list-runtimes | awk '$1 == "Microsoft.NETCore.App" {print $2}')"
          if [ "$sdks" != "$DECLARED_SDK" ] || [ "$(dotnet --version)" != "$DECLARED_SDK" ]; then
            echo "::error::reachable SDK(s) [$(echo $sdks)], declared $DECLARED_SDK only"
            exit 1
          fi
          if [ "$runtimes" != "$DECLARED_RUNTIME" ]; then
            echo "::error::reachable Microsoft.NETCore.App runtime(s) [$(echo $runtimes)], declared $DECLARED_RUNTIME only"
            exit 1
          fi

      - name: Build benchmarks (Release)
        run: dotnet build Tests/Verbara.Sdk.Benchmarks/ -c Release --nologo

      # Each `--filter` argument runs ONE benchmark class. We run the
      # README-cited hot paths in series so a single failure (timeout, missing
      # type) doesn't kill the whole job before the rest produce data.
      #
      # Filters use BenchmarkDotNet glob syntax: '*' is wildcard. Add new hot
      # paths here when the README adds a new "Performance" table row — and add
      # the matching `sources` row + baseline entries to
      # Tests/Verbara.Sdk.Benchmarks/baseline.json in the SAME PR, or the
      # comparison below cannot know the new benchmark was supposed to run.
      #
      # `|| true` is intentional and is NOT a hole any more: the comparison step
      # fails closed on the empty artifacts directory a crashed step leaves.
      - name: AMI parse + dispatch
        run: |
          cd Tests/Verbara.Sdk.Benchmarks
          dotnet run -c Release --no-build -- --filter '*AmiProtocolReader*' --exporters json --artifacts ../../artifacts/ami || true
      - name: ARI JSON deserialize Channel
        run: |
          cd Tests/Verbara.Sdk.Benchmarks
          dotnet run -c Release --no-build -- --filter '*AriJson*' --exporters json --artifacts ../../artifacts/ari-json || true
      - name: ARI parse StasisStart event
        run: |
          cd Tests/Verbara.Sdk.Benchmarks
          dotnet run -c Release --no-build -- --filter '*AriParseEvent*' --exporters json --artifacts ../../artifacts/ari-event || true
      - name: ChannelManager lookups
        run: |
          cd Tests/Verbara.Sdk.Benchmarks
          dotnet run -c Release --no-build -- --filter '*ChannelManager*' --exporters json --artifacts ../../artifacts/channel-manager || true
      - name: Observer dispatch
        run: |
          cd Tests/Verbara.Sdk.Benchmarks
          dotnet run -c Release --no-build -- --filter '*ObserverDispatch*' --exporters json --artifacts ../../artifacts/observer || true
      # Turn-detection inference latency (ADR-0042 D8 + change §3.5). Added WITHOUT a
      # baseline.json entry on purpose: every other band here was calibrated from 13 real runs of
      # this workflow, and this benchmark has none yet. The flip to PERF_GATE_ENFORCE='true' left it
      # unbaselined: its band gets calibrated the same way, from its own observations, in its own
      # PR. Until then its cases are declared in baseline.json `unbanded`: the comparator checks
      # that each one ran and measured, and does not band its value — a band guessed today would
      # be the "calibrated from observation, never guessed" rule broken.
      - name: Turn-detection end-of-utterance decision
        run: |
          cd Tests/Verbara.Sdk.Benchmarks
          dotnet run -c Release --no-build -- --filter '*TurnDetection*' --exporters json --artifacts ../../artifacts/turn-detection || true
      # The event pump between the AMI reader and every handler. Its two deterministic rows are
      # gated on bytes (bytes decide, time informs); EnqueueAndConsume1000Events is bimodal by a
      # writer/consumer race and is reported, never gated. Time bands follow two weekly runs.
      - name: AMI event pump
        run: |
          cd Tests/Verbara.Sdk.Benchmarks
          dotnet run -c Release --no-build -- --filter '*AsyncEventPump*' --exporters json --artifacts ../../artifacts/async-event-pump || true
      # Queue and conference managers: the same publication path as ChannelManager, each event with
      # and without one subscriber, because only the subscribed row shows what a change a handler
      # hears costs. Gated on bytes per event; time bands follow two weekly runs.
      - name: QueueManager event paths
        run: |
          cd Tests/Verbara.Sdk.Benchmarks
          dotnet run -c Release --no-build -- --filter '*QueueManager*' --exporters json --artifacts ../../artifacts/queue-manager || true
      - name: MeetMeManager event paths
        run: |
          cd Tests/Verbara.Sdk.Benchmarks
          dotnet run -c Release --no-build -- --filter '*MeetMeManager*' --exporters json --artifacts ../../artifacts/meetme-manager || true

      # ── The gate itself (ADR-0042 D4) ────────────────────────────────────────
      # Bytes decide, time informs: rows with a `bytes` entry are gated on
      # Memory.BytesAllocatedPerOperation (exact or a stated bound), which no CPU
      # model or ISA moves — but the core count can, so bytes are read on this runner.
      # Time is relative-regression only: observed mean vs the committed HOSTED-RUNNER
      # mean, inside a per-benchmark band calibrated from 13 real runs of this
      # workflow. It does not compare against README.md's workstation figures
      # (1.97x-2.35x faster — an absolute comparison would be permanently red).
      # Reported both ways, failing one way: SLOWER and MORE-BYTES fail the job,
      # FASTER and FEWER-BYTES are reported and file the issue without failing it.
      # Fails closed: absent results/ dir, absent report, empty `Benchmarks`,
      # a baselined or `unbanded` FullName that never appeared, an observed
      # entry with no finite `Statistics.Mean` (banded or not), or a report whose
      # SDK, runtime or core count is not baseline.json `environment` are all breaches. Exit 2 (gate misconfigured) fails
      # the job in BOTH modes — a guard that is broken must not read green.
      - name: Compare against baseline
        id: perf
        # `!cancelled()` rather than `always()`: a benchmark step that CRASHED must still be
        # compared (that is the whole point — no report is a breach), but a cancelled run has
        # nothing to say and must not file an issue about it.
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/ci/check-perf-baseline.py \
            --baseline Tests/Verbara.Sdk.Benchmarks/baseline.json \
            --artifacts-root artifacts \
            --markdown-out perf-baseline-report.md

      - name: Publish comparison to the run summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f perf-baseline-report.md ]; then
            cat perf-baseline-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "perf-baseline produced no report — see the previous step." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ADR-0042 D5 — a weekly red nobody is told about is observational under
      # another name. Reuses ONE open issue by exact title so the week-by-week
      # trend accumulates in one place instead of filing a duplicate every
      # Sunday. Runs in both modes and on every breach: for a FASTER or
      # FEWER-BYTES breach the job stays green, so this issue is the ONLY
      # signal it happened.
      - name: File or update the breach issue
        if: ${{ !cancelled() && steps.perf.outputs.status == 'breach' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/report-perf-breach.sh perf-baseline-report.md

      # ── In-job comparison against the reference tag (ADR-0042 addendum) ─────
      # Every step runs unless the run was cancelled, so a failed absolute gate still leaves the
      # comparison measured. The reference is the tag's own tree (its src/ and its own benchmark
      # project), in a worktree outside the workspace: HEAD stays where every step above put it.
      # A reference that fails to check out or build is not skipped: its reports are missing and
      # the comparator reports that as structural. The breach issue above is not filed from here.
      - name: Read the declared in-job reference
        id: abab_ref
        if: ${{ !cancelled() }}
        continue-on-error: ${{ env.PERF_ABAB_ENFORCE != 'true' }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, re
          tag = json.load(open("Tests/Verbara.Sdk.Benchmarks/baseline.json", encoding="utf-8"))["abab"]["reference_tag"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), tag
          print(f"tag={tag}")
          PY
      - name: Check out the reference tag beside HEAD
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          REF: ${{ steps.abab_ref.outputs.tag }}
        run: |
          set -euo pipefail
          # The checkout is shallow and carries no tags: fetch this one only. Worktrees skip Git
          # LFS, so pull it, or the turn-detection model is a pointer file on the reference arm.
          git fetch --no-tags --depth=1 origin "+refs/tags/${REF}:refs/tags/${REF}"
          git worktree add --detach "$RUNNER_TEMP/perf-ref" "${REF}^{commit}"
          git -C "$RUNNER_TEMP/perf-ref" lfs pull
      - name: Build the reference benchmarks (Release)
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}/perf-ref
        run: dotnet build Tests/Verbara.Sdk.Benchmarks/ -c Release --nologo
      - name: Run the reference and HEAD alternated (R H H R)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 70
        env:
          REF: ${{ steps.abab_ref.outputs.tag }}
        run: >-
          bash scripts/ci/run-perf-abab.sh --baseline Tests/Verbara.Sdk.Benchmarks/baseline.json
          --head "$GITHUB_WORKSPACE" --reference "$RUNNER_TEMP/perf-ref" --reference-tag "$REF"
          --out artifacts-abab
      # Observing, even an exit 2 (the guard misconfigured) is an orange step and the job stays
      # green; once PERF_ABAB_ENFORCE is 'true' the same exit fails it, as the absolute gate's does.
      - name: Compare HEAD against the reference in this job
        id: abab
        if: ${{ !cancelled() }}
        continue-on-error: ${{ env.PERF_ABAB_ENFORCE != 'true' }}
        run: |
          python3 scripts/ci/check-perf-abab.py \
            --baseline Tests/Verbara.Sdk.Benchmarks/baseline.json \
            --abab-root artifacts-abab \
            --markdown-out perf-abab-report.md --json-out perf-abab.json
      - name: Publish the in-job comparison to the run summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f perf-abab-report.md ]; then
            cat perf-abab-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "In-job comparison produced no report — see the previous step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload BenchmarkDotNet JSON reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-reports-${{ github.run_id }}
          path: |
            artifacts/**/results/*.json
            perf-baseline-report.md
            artifacts-abab/manifest.json
            artifacts-abab/list-*.txt
            artifacts-abab/*/results/*-report-full-compressed.json
            artifacts-abab/*/*.log
            perf-abab-report.md
            perf-abab.json
          if-no-files-found: warn
          retention-days: 90
