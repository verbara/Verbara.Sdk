name: CI

# PR runs give fast feedback; the merge queue (merge_group) is the authoritative
# gate that tests the real merge result before landing on main. The post-merge
# push run is intentionally dropped — merge_group already validated that exact
# tree, so re-running on push:[main] would be pure redundancy.
on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  # Docs/data-only CI fast-path gate (verbara-meta/ADR-0016 §1). Classifies the PR / merge_group
  # diff against the event's OWN base and exposes outputs.docs_only.
  #
  # Sdk is the ecosystem's FIRST classic-branch-protection + merge-queue repo: the 9 required
  # contexts come from `gh api .../branches/main/protection` (strict:false); ruleset 16696290
  # carries a merge_queue rule ONLY (ALLGREEN, SQUASH) and zero required checks.
  #
  # Guard level is chosen PER CONTEXT, not per repo (§1 precondition):
  #  * FIVE plain-named heavy required contexts in this file — Unit Tests, Coverage Ratchet,
  #    AOT Trim Check, Pack Warnings Gate, Audit Test Asserts — take the cheap JOB-level guard:
  #    a job skipped by `if:` reports conclusion `skipped`, which satisfies a required context,
  #    at zero runner cost.
  #  * The SIXTH, "Functional Tests (Testcontainers) (23)", is MATRIX-SUFFIXED and takes the
  #    STEP-level guard: a false job-level `if:` collapses the matrix into one unsuffixed
  #    check-run, the (23) context never reports, and the PR is stranded forever (#104/#105,
  #    ADR-0039 addendum — see that job's comment).
  # Always-run (NO `needs: gate`): "OpenSpec Validate" (validates exactly the docs diff, §3.3)
  # and "Coverage Script Tests", which hosts this classifier's unit tests and MUST run on the very
  # PR that edits it (§3.4). The one required context NOT in this file, "Analyze (C#)", lives in
  # codeql.yml, which is merge_group-wired — paths-ignore there is BANNED and `needs:` cannot cross
  # workflow files, so codeql.yml carries its own gate job.
  #
  # Allowlist: docs/** openspec/** CHANGELOG.md, top-level *.md, **/README.md — MINUS the six
  # Markdown files Verbara.Sdk.DocSnippets.Tests Roslyn-compiles inside the (gated) Unit Tests job.
  gate:
    name: Docs-only gate
    runs-on: ubuntu-latest
    timeout-minutes: 5        # bounds the new critical-path job (ruleset 16696290 waits 60 min)
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0          # base sha must be reachable for the diff
      - id: classify
        env:                      # §3.1 event-specific base — never hardcode origin/main
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        # Invoked via `bash` (not ./) so the committed file mode is never load-bearing, and the
        # verdict is echoed to the LOG as well as to $GITHUB_OUTPUT — wave 1 sent 100% of stdout
        # to the outputs file, leaving an empty step whenever a classification had to be debugged.
        # Command substitution under the default `bash -e` shell preserves the classifier's exit
        # status, so a crash FAILS this job => `needs.gate.result != 'success'` => heavy jobs RUN.
        run: |
          verdict="$(bash ./scripts/ci/classify-docs-only.sh "$BASE_SHA" "${{ github.sha }}")"
          echo "classify-docs-only: $verdict"
          echo "$verdict" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.docs_only != 'true') }}
    # Runs the unit subset once and collects coverage in the same execution
    # (coverlet's collection overhead is small against the ~11 min saved by not
    # re-building + re-running the suite in Coverage Ratchet). The raw cobertura
    # results are uploaded as an artifact the Coverage Ratchet job consumes.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Verbara.Sdk.slnx -c Release
      - name: Run unit tests with coverage
        run: >-
          dotnet test Verbara.Sdk.slnx --no-build -c Release
          --filter "Category!=Functional&Category!=Integration&Category!=Realtime&Category!=Spike"
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --results-directory ${{ github.workspace }}/coverage
          --logger "console;verbosity=normal"
      - name: Upload raw coverage results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-raw-${{ github.sha }}
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: error

  coverage:
    name: Coverage Ratchet
    runs-on: ubuntu-latest
    needs: [unit-tests, gate]
    # ADR-0016 §3.2 guard PLUS an explicit re-statement of the pre-existing `needs: unit-tests`
    # SUCCESS edge, which `!cancelled()` would otherwise drop: this job downloads the artifact
    # unit-tests produces, so it must stay skipped when unit-tests FAILS (today's implicit
    # success()) as well as when the diff is docs-only (unit-tests skipped => no artifact).
    # Bracket index syntax because the job id contains a hyphen.
    if: ${{ !cancelled() && needs['unit-tests'].result == 'success' && (needs.gate.result != 'success' || needs.gate.outputs.docs_only != 'true') }}
    # Fast consumer of the unit-tests coverage artifact — no build, no test run
    # (that duplicate ~11 min run was removed; unit-tests now collects coverage
    # in its single execution). Merges the raw cobertura results with
    # reportgenerator and gates against coverage-floor.json. Mirrors the Platform
    # pilot + Platform.Web ratchet; the floor, coverlet.runsettings exclusions
    # (test asms, generated code, migrations, container-only src assemblies —
    # Cluster.Postgres / Sessions.Postgres / Sessions.Redis) and manual-only
    # ratchet semantics (no CI write-back) are unchanged (verbara-meta/ADR-0003).
    # Baseline + rationale: docs/research/2026-06-14-sdk-coverage-baseline.md.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # fetch-depth: 0 is REQUIRED by coverage-gate-v2 (verbara-meta/ADR-0013):
          # check-patch-coverage.py needs `git merge-base origin/main HEAD`, which
          # a shallow clone cannot resolve. Works on both pull_request and
          # merge_group refs. The script's liveness self-test fails loud if this
          # is ever removed (an empty merge-base reads as a shallow clone).
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install diff-cover (pinned)
        # The only new supply-chain surface for the patch gate. Pinned exactly
        # (ADR-0013). ubuntu runners ship python3 + pip.
        run: pip install --disable-pip-version-check diff_cover==10.3.0
      - name: Download raw coverage results
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-raw-${{ github.sha }}
          path: coverage
      - name: Merge coverage report
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:"coverage/report" \
            -reporttypes:"Cobertura;TextSummary;HtmlInline_AzurePipelines"
      - name: Enforce coverage band (manual ratchet, two-sided)
        # coverage-gate-v2 backstop (ADR-0013 clause b): fail below floor OR above
        # floor+slack (stale floor), plus blocking branch floor + lines_valid_min.
        run: python3 scripts/check-coverage-floor.py coverage/report/Cobertura.xml coverage-floor.json
      - name: Enforce patch coverage (diff-cover)
        # coverage-gate-v2 primary gate (ADR-0013 clause a): coverage of the lines
        # changed vs origin/main must be >= coverage-floor.json["patch"].
        run: python3 scripts/check-patch-coverage.py coverage/report/Cobertura.xml coverage-floor.json
      - name: Enforce coverage-exclusion baseline (denominator guard)
        # coverage-gate-v2 denominator guard (ADR-0013): net-new
        # [ExcludeFromCodeCoverage] markers fail the build (shrinking the
        # denominator would game both coverage gates).
        run: python3 scripts/check-exclusion-baseline.py coverage-exclusion-baseline.json .
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage/report

  coverage-scripts:
    name: Coverage Script Tests
    runs-on: ubuntu-latest
    # Cheap (~seconds, no .NET): unit-tests the three coverage-gate-v2 guard
    # scripts (verbara-meta/ADR-0013). The SyncFence precedent requires the guard
    # itself be tested. diff-cover is installed so the patch-coverage cases run
    # (they self-skip when it is absent, but CI always has it).
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install diff-cover (pinned)
        run: pip install --disable-pip-version-check diff_cover==10.3.0
      - name: Run coverage-script unit tests
        run: python3 -m unittest discover scripts/tests
      # Docs/data-only fast-path classifier unit tests (verbara-meta/ADR-0016 §3.4). This job
      # carries NO `needs: gate` edge on purpose — it must run on the very PR that edits the
      # classifier (and such a PR is never docs_only: scripts/ci/... is a nested non-doc path,
      # asserted by one of the cases). Promoted to a REQUIRED context (2026-07-27) so a
      # mis-widened allowlist is merge-BLOCKING, not advisory: this job is the only thing standing
      # between a broken classifier and six silently-skipped required checks.
      - name: Run docs-only classifier unit tests (ADR-0016)
        run: bash scripts/tests/test_classify_docs_only.sh

  aot-check:
    name: AOT Trim Check
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify AOT trim safety
        run: bash tools/verify-aot.sh

  pack-check:
    name: Pack Warnings Gate
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build Release
        run: dotnet build Verbara.Sdk.slnx -c Release
      - name: Pack with warnings as errors
        # Surfaces PackageValidation baseline drift, PublicAPI drift, missing
        # icons/release-notes, and license-expression issues at PR time so
        # publish.yml never hits them in the release path.
        run: dotnet pack Verbara.Sdk.slnx -c Release --no-build -p:TreatWarningsAsErrors=true -o ./artifacts
      - name: List produced packages
        run: ls -la ./artifacts/*.nupkg 2>/dev/null || true

  audit-test-asserts:
    name: Audit Test Asserts
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run assert audit
        # Walks Tests/**/*.cs for [Fact]/[Theory] declarations and fails the build
        # if any test body lacks an Assert./Should() expression. Catches the
        # "smoke test that doesn't assert" anti-pattern at PR time.
        run: bash tools/audit-test-asserts.sh
      - name: Enforce recording redaction rule (ADR-0041 D5)
        # Scans every Tests/**/Recordings/ tree for credential-shaped content.
        # Recordings of real provider traffic ship in a PUBLIC repo, so the rule
        # is enforced, not merely documented. It rides in this job rather than a
        # new one because this is already the required Tests/**-tree hygiene
        # context: a new job would report as non-required and therefore
        # non-blocking, which is the one thing a credential guard must not be.
        # Cheap (stdlib python, no build). Its own unit tests run in the
        # always-on "Coverage Script Tests" job via unittest discovery.
        # NOTE: if an over-cap capture is ever added under .../Recordings/large/
        # (Git-LFS, ADR-0041 D6), this job's checkout needs `lfs: true` — the
        # script refuses to scan an unfetched pointer rather than false-greening.
        run: python3 scripts/check-recording-redaction.py .

  functional-tests:
    name: Functional Tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: [unit-tests, gate]
    # This job-level `if:` must NEVER evaluate false on a docs-only diff — a false job-level if:
    # collapses the matrix and the required context "Functional Tests (Testcontainers) (23)" then
    # never reports (#104/#105). Its ONLY purpose is to preserve the pre-existing `needs:
    # unit-tests` edge that `!cancelled()` drops, while staying TRUE when unit-tests is SKIPPED
    # (docs-only) so the matrix still expands. The docs-only guard itself lives on the two heavy
    # STEPS below. Bracket index syntax because the job id contains a hyphen.
    if: ${{ !cancelled() && needs['unit-tests'].result != 'failure' && needs['unit-tests'].result != 'cancelled' }}
    # Bot-authored PRs skip the *heavy work* of the representative pull_request
    # functional variant; merge_group always runs the full matrix and remains the
    # landing gate (an automerged bot PR loses zero landing validation). The guard
    # is applied at STEP level, NOT job level (ADR-0039 addendum, 2026-07-15):
    # a job-level if: that evaluates false collapses the matrix so GitHub reports
    # a single check named "Functional Tests (Testcontainers)" (no matrix suffix,
    # SKIPPED), and the required context "Functional Tests (Testcontainers) (23)"
    # then NEVER reports — leaving bot PRs BLOCKED forever (observed on #104/#105).
    # Keeping the job (and its matrix) always-run materializes the (23) check-run
    # name and reports it success in seconds; only the Docker/Testcontainers steps
    # are guarded. The guard shape is load-bearing in ways the YAML can't show:
    # the merge_group term MUST lead (the queue actor is the enqueuer, not the bot,
    # so user.login isn't the bot on merge_group); it keys on
    # github.event.pull_request.user.login, NOT github.actor (actor flips to the
    # human on a re-run and would re-enable the matrix). See ADR-0039 + addendum.
    # Representative matrix on pull_request ([23] — newest supported, fast
    # feedback); full matrix in the merge queue ([22, 23]) so nothing lands on
    # main without full-matrix validation. A 22-only regression is caught at
    # queue time rather than PR time (accepted — rare; keeps ~20 min of
    # full-matrix wall-clock out of every PR iteration). See ADR-0038 (D3) and
    # verbara-meta/ADR-0003. Cost: ~19 min per matrix variant, parallel across
    # runners.
    strategy:
      fail-fast: false
      matrix:
        asterisk: ${{ github.event_name == 'merge_group' && fromJSON('[22, 23]') || fromJSON('[23]') }}
    env:
      ASTERISK_VERSION: ${{ matrix.asterisk }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Pre-pull Docker images and build Asterisk test image
        # Guarded (ADR-0039 addendum): bot-authored pull_request events skip this
        # heavy step; merge_group and human PRs run it in full. See the job comment.
        #
        # ADR-0039 addendum bot skip (expression UNCHANGED and still LEADING — the merge_group
        # term must lead) AND'ed with the ADR-0016 docs-only guard. Deliberately NO `!cancelled()`
        # here: at STEP level any status function REMOVES the implicit success() over the preceding
        # steps, so the expensive step would run after a failed checkout/setup-dotnet. Fail-closed
        # is already guaranteed — gate=failure or gate=skipped makes the second term true => RUN.
        if: >-
          (github.event_name == 'merge_group' || github.event.pull_request.user.login != 'dependabot[bot]')
          && (needs.gate.result != 'success' || needs.gate.outputs.docs_only != 'true')
        # Populate the Docker layer cache before tests run so container startups are fast.
        # The Asterisk image is rebuilt per-matrix because the FROM tag changes.
        run: |
          docker pull postgres:18-alpine &
          docker pull ghcr.io/shopify/toxiproxy:2.12.0 &
          docker pull ctaloi/sipp &
          wait
          docker build -f docker/Dockerfile.asterisk docker/ \
            --build-arg ASTERISK_VERSION=${{ matrix.asterisk }} \
            --build-arg CODEC_OPUS_VERSION=${{ matrix.asterisk }}.0_1.3.0 \
            -t asterisk-sdk-test-cache:${{ matrix.asterisk }}
      - name: Run functional + integration tests
        # Guarded (ADR-0039 addendum): bot-authored pull_request events skip the
        # Testcontainers test execution; merge_group and human PRs run it in full.
        # With this step and the pre-pull skipped, the job completes SUCCESS in
        # seconds on bot PRs while the (23) check-run name still reports.
        #
        # ADR-0039 addendum bot skip (expression UNCHANGED and still LEADING — the merge_group
        # term must lead) AND'ed with the ADR-0016 docs-only guard. Deliberately NO `!cancelled()`
        # here: at STEP level any status function REMOVES the implicit success() over the preceding
        # steps, so the expensive step would run after a failed checkout/setup-dotnet. Fail-closed
        # is already guaranteed — gate=failure or gate=skipped makes the second term true => RUN.
        if: >-
          (github.event_name == 'merge_group' || github.event.pull_request.user.login != 'dependabot[bot]')
          && (needs.gate.result != 'success' || needs.gate.outputs.docs_only != 'true')
        # MaxCpuCount=1 serializes test projects so FunctionalTests and IntegrationTests
        # do not start their Docker stacks concurrently (CI runner has limited resources).
        # ASTERISK_VERSION env reaches AsteriskContainer.CreateImageAsync via
        # ImageFromDockerfileBuilder.WithBuildArgument, so the Testcontainers-managed
        # image matches the matrix target.
        run: dotnet test Verbara.Sdk.slnx --filter "Category=Functional|Category=Integration|Category=Realtime" --logger "console;verbosity=detailed" -- RunConfiguration.MaxCpuCount=1
        timeout-minutes: 30

  # OpenSpec docs gate (2026-07-04 ecosystem audit): changes/specs are agent-edited
  # markdown with a strict parser — validate them like code. Pinned CLI version.
  openspec:
    name: OpenSpec Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate specs and changes (strict)
        run: npx -y @fission-ai/openspec@1.6.0 validate --all --strict --no-interactive
