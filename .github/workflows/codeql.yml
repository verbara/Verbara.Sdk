name: CodeQL

on:
  # push:[main] is kept (unlike ci.yml) so the default-branch security baseline
  # stays fresh — the merge_group ref is not main, so it cannot maintain it.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Weekly Sundays 06:00 UTC (keeps baseline fresh without pressuring weekday CI).
    - cron: "0 6 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

# Supersede in-flight PR runs when a branch is pushed again (ADR-0051) — same reasoning as ci.yml,
# and this workflow is the second-heaviest thing a PR push starts (Analyze (C#), 6–10 min).
# ONLY pull_request is cancellable: merge_group is the landing gate, and push:[main] + the weekly
# schedule maintain the default-branch security baseline, which must never be cancelled by a
# later run. `github.ref` is unique per queue entry and per event, so the group cannot collide
# across those three.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs/data-only CI fast-path gate (verbara-meta/ADR-0016 §1) — codeql.yml's OWN copy, because
  # `needs:` cannot cross workflow files (same reason Sdk.Pro's aot-validate.yml carries one).
  # "Analyze (C#)" IS a required context (classic branch protection) AND this workflow is
  # merge_group-wired, so §2's workflow-level paths-ignore is BANNED here — it would strand
  # "Analyze (C#)" in `Expected` forever, on both phases.
  #
  # push:[main] and the weekly schedule have NO base sha, so the CLASSIFY STEP (not the job) is
  # event-guarded: on those events the step is skipped, outputs.docs_only is the empty string, and
  # the guard below reads `'' != 'true'` => analyze RUNS. That is the SAME expression row wave 1
  # exercises on every code PR (gate=success + docs_only!='true' => RUN) — deliberately NOT the
  # never-exercised "gate=skipped" row, and no red gate check ever appears on main. The
  # default-branch and scheduled security baselines are structurally never path-skipped.
  gate:
    name: Docs-only gate (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 5        # bounds the new critical-path job (ruleset 16696290 waits 60 min)
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0          # base sha must be reachable for the diff
      - id: classify
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:                      # §3.1 event-specific base — never hardcode origin/main
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          verdict="$(bash ./scripts/ci/classify-docs-only.sh "$BASE_SHA" "${{ github.sha }}")"
          echo "classify-docs-only: $verdict"
          echo "$verdict" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.docs_only != 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: csharp
          queries: security-extended,security-and-quality

      - name: Build solution
        run: dotnet build Verbara.Sdk.slnx -c Release --no-incremental

      # Analyse, filter, THEN upload (ADR-0051 addendum, 2026-09-12). 633 of main's 1,082 alerts sat in code the
      # .NET SDK's own source generators write under obj/**/generated/, which no change here can reach, and a
      # CodeQL config cannot exclude it: `paths`/`paths-ignore` are not honoured for a compiled language analysed
      # from a traced build, which the build step above is. So analyze writes its SARIF, the filter drops results
      # in System.*/Microsoft.* generator output whose rule resolves and is not security-relevant (our own
      # generator's output stays analysed, and a security result is never dropped), and upload-sarif sends the
      # rest.
      #
      # `upload: failure-only`, not `never`: on success analyze uploads nothing, and when analysis FAILS the
      # Action's post step still uploads the failed-run diagnostics under this category, as `always` did. The
      # category must stay identical on both steps — the Action refuses a second upload for one category in a job,
      # and a different category would start a second analysis and strand every existing alert open under this
      # one. scripts/tests/test_filter_codeql_sarif.sh asserts the wiring.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:csharp"
          upload: failure-only
          output: ${{ runner.temp }}/codeql-sarif

      # Fails closed: a file the filter cannot read as one SARIF 2.1.0 log exits 2 and writes nothing, so this job
      # goes red and the upload below never runs — the baseline is never replaced by an unfiltered log.
      - name: Drop results in .NET source-generator output
        env:
          RAW_SARIF_DIR: ${{ runner.temp }}/codeql-sarif
          FILTERED_SARIF_DIR: ${{ runner.temp }}/codeql-sarif-filtered
        run: |
          shopt -s nullglob
          sarifs=("$RAW_SARIF_DIR"/*.sarif)
          if [ "${#sarifs[@]}" -eq 0 ]; then
            echo "::error::analyze wrote no .sarif file to $RAW_SARIF_DIR — nothing to filter, so nothing is uploaded."
            exit 1
          fi
          mkdir -p "$FILTERED_SARIF_DIR"
          for sarif in "${sarifs[@]}"; do
            bash ./scripts/ci/filter-codeql-sarif.sh "$sarif" "$FILTERED_SARIF_DIR/$(basename "$sarif")"
          done

      - name: Upload filtered CodeQL results
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif-filtered
          category: "/language:csharp"
