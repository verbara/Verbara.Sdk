name: CodeQL

on:
  # push:[main] is kept (unlike ci.yml) so the default-branch security baseline
  # stays fresh — the merge_group ref is not main, so it cannot maintain it.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Weekly Sundays 06:00 UTC (keeps baseline fresh without pressuring weekday CI).
    - cron: "0 6 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.36.3
        with:
          languages: csharp
          queries: security-extended,security-and-quality

      - name: Build solution
        run: dotnet build Verbara.Sdk.slnx -c Release --no-incremental

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.36.3
        with:
          category: "/language:csharp"
