name: Asterisk Base Image

# Builds the Asterisk base image of docker/base/ from the official release tarball, after checking the tarball's
# signature against the versioned Asterisk Development Team key and its sha256 against docker/base/versions.txt, and
# gates it on the module list of docker/base/expected-modules/<major>.txt.
#
# Two triggers, and only two:
#   - pull_request on docker/base/** (or this file): builds and gates every version of versions.txt, pushes nothing,
#     so the recipe cannot rot between releases;
#   - workflow_dispatch with one version: the only path that publishes. It runs from main only, builds, gates, pushes
#     <registry>/<namespace>/asterisk-base:<version>_trixie-<recipe7> (recipe7: the last commit that touched
#     docker/base/), signs the pushed digest with cosign keyless (GitHub OIDC, recorded in Rekor), attests an SPDX
#     SBOM to it, and writes the pinned reference to the job summary.
# Never on a schedule: a pin by digest never moves, and a rebuild happens only when someone wants a re-pin. A tag that
# already exists is never pushed over. scripts/tests/test_asterisk_base_workflow.py fails a change that adds a
# schedule or lets a pull_request run reach a push, a login, a signature or a write permission.
#
# The image name is assembled from REGISTRY, IMAGE_NAMESPACE and IMAGE_NAME so that this file never names the image
# without a digest (the image-pin guard reads .github/workflows/).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Asterisk version to publish: one line of docker/base/versions.txt (e.g. 22.12.0)"
        required: true
        type: string
  pull_request:
    paths:
      - "docker/base/**"
      - ".github/workflows/asterisk-base.yml"

permissions:
  contents: read

concurrency:
  group: asterisk-base-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: verbara
  IMAGE_NAME: asterisk-base
  DEBIAN_SUITE: trixie

jobs:
  versions:
    name: Versions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read docker/base/versions.txt
        id: read
        run: |
          versions="$(awk '!/^[[:space:]]*(#|$)/ { print $1 }' docker/base/versions.txt)"
          if [ -z "$versions" ]; then
            echo "::error file=docker/base/versions.txt::holds no version"
            exit 1
          fi
          matrix="$(printf '%s\n' "$versions" | python3 -I -c 'import json, sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "versions: $matrix"

  build:
    name: Build (${{ matrix.version }}, no push)
    needs: versions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tarball (signature and sha256)
        env:
          VERSION: ${{ matrix.version }}
        run: bash docker/base/verify-tarball.sh "$VERSION" "$RUNNER_TEMP/tarball"
      - name: Build
        env:
          VERSION: ${{ matrix.version }}
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          sha="$(awk -v v="$VERSION" '$1 == v { print $2 }' docker/base/versions.txt)"
          revision="$(git log -1 --format=%H -- docker/base)"
          docker build --progress=plain \
            --build-arg ASTERISK_VERSION="$VERSION" \
            --build-arg TARBALL_SHA256="$sha" \
            --build-arg RECIPE_REVISION="$revision" \
            --build-arg SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
            -t "local/asterisk-base:$VERSION" docker/base
      - name: Module gate
        env:
          VERSION: ${{ matrix.version }}
        run: bash docker/base/check-modules.sh "local/asterisk-base:$VERSION" "$VERSION"

  publish:
    name: Publish ${{ inputs.version }}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'verbara/Verbara.Sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the version, the recipe commit and the tag
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
            echo "::error::'$VERSION' is not <major>.<minor>.<patch>[-rcN]"
            exit 1
          fi
          sha="$(awk -v v="$VERSION" '$1 == v { print $2 }' docker/base/versions.txt)"
          if [ -z "$sha" ]; then
            echo "::error file=docker/base/versions.txt::has no line for $VERSION"
            exit 1
          fi
          revision="$(git log -1 --format=%H -- docker/base)"
          image="$REGISTRY/$IMAGE_NAMESPACE/$IMAGE_NAME"
          tag="${VERSION}_${DEBIAN_SUITE}-${revision:0:7}"
          {
            echo "version=$VERSION"
            echo "tarball_sha256=$sha"
            echo "revision=$revision"
            echo "image=$image"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "will publish $image:$tag (recipe $revision, tarball sha256 $sha)"
      - name: Verify the tarball (signature and sha256)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash docker/base/verify-tarball.sh "$VERSION" "$RUNNER_TEMP/tarball"
      - name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARBALL_SHA256: ${{ steps.meta.outputs.tarball_sha256 }}
          REVISION: ${{ steps.meta.outputs.revision }}
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build --progress=plain \
            --build-arg ASTERISK_VERSION="$VERSION" \
            --build-arg TARBALL_SHA256="$TARBALL_SHA256" \
            --build-arg RECIPE_REVISION="$REVISION" \
            --build-arg SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
            -t "$REF" docker/base
      - name: Module gate
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: bash docker/base/check-modules.sh "$REF" "$VERSION"
      - name: Log in to the registry
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin
      - name: Refuse a tag that already exists
        env:
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "::error::$REF already exists; a published tag is never pushed over (change the recipe or the version)"
            exit 1
          fi
      - name: Push
        id: push
        env:
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          docker push "$REF" | tee "$RUNNER_TEMP/push.log"
          digest="$(grep -Eo 'digest: sha256:[0-9a-f]{64}' "$RUNNER_TEMP/push.log" | tail -n 1 | cut -d' ' -f2)"
          if [ -z "$digest" ]; then
            echo "::error::docker push printed no digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign (cosign keyless)
        env:
          SUBJECT: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$SUBJECT"
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - name: Attest the SBOM (cosign keyless)
        env:
          SUBJECT: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$SUBJECT"
      - name: Verify the signature and the attestation
        env:
          SUBJECT: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/asterisk-base.yml@refs/heads/main
        run: |
          cosign verify --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$SUBJECT" > /dev/null
          cosign verify-attestation --type spdxjson --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$SUBJECT" > /dev/null
          echo "signature and SBOM attestation verify for $SUBJECT"
      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ steps.meta.outputs.tag }}
          path: ${{ runner.temp }}/sbom.spdx.json
          if-no-files-found: error
      - name: Summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
          REVISION: ${{ steps.meta.outputs.revision }}
          TARBALL_SHA256: ${{ steps.meta.outputs.tarball_sha256 }}
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/asterisk-base.yml@refs/heads/main
        run: |
          major="${VERSION%%.*}"
          {
            echo "## Asterisk base $VERSION published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$IMAGE:$TAG\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Recipe commit | \`$REVISION\` |"
            echo "| Tarball sha256 | \`$TARBALL_SHA256\` |"
            echo
            echo "Pin line for \`docker/asterisk-base-images.txt\`:"
            echo
            echo '```'
            echo "$major $IMAGE:$TAG@$DIGEST"
            echo '```'
            echo
            echo "Verify from anywhere:"
            echo
            echo '```'
            echo "cosign verify --certificate-identity $IDENTITY --certificate-oidc-issuer https://token.actions.githubusercontent.com $IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of the registry
        if: always()
        run: docker logout "$REGISTRY" || true
